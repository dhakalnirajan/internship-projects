# Paths
data:
  raw_images: "data/raw/images"
  raw_annotations: "data/raw/annotations"
  processed_images: "data/processed/images"
  processed_labels: "data/processed/labels"
  dataset_yaml: "data/dataset.yaml"

# Training
train:
  model_size: "yolov8s.pt" # Options: n, s, m, l, x
  epochs: 25
  batch_size: 16
  img_size: 640
  lr0: 0.01
  lrf: 0.01
  weight_decay: 0.0005
  augment: true
  patience: 20

# Evaluation & Validation Settings
evaluation:
  conf: 0.001
  iou: 0.6
  max_det: 300

# Real-time detection & Inference
inference:
  conf_threshold: 0.6
  iou_threshold: 0.5
  frame_skip: 3
  max_age: 30
  min_hits: 3
  alert_distance_meters: 5.0

# Export & Benchmark
export:
  format: "onnx"
  half: true
  int8: false

logging:
  level: "INFO"
  file: "pothole.log"