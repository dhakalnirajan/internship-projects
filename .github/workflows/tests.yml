name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  numpy-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pandas scikit-learn pytest
      - name: Syntax + import smoke test (fail fast before pytest)
        run: python -m cnn_benchmark.smoke_test
      - name: Download MNIST (used by a couple of tests)
        run: python -c "import urllib.request; urllib.request.urlretrieve('https://s3.amazonaws.com/img-datasets/mnist.npz', 'mnist.npz')"
      - name: Gradient checks (conv2d + pooling)
        run: python -m cnn_benchmark.grad_check
      - name: Pytest suite (pure-NumPy + report conditionals)
        run: python -m pytest cnn_benchmark/test_benchmark.py -q -x

  torch-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps (incl. torch CPU + torchvision)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax + import smoke test (fail fast before pytest)
        run: python -m cnn_benchmark.smoke_test
      - name: Pytest suite incl. torch bridge + weight conversion
        run: python -m pytest cnn_benchmark/test_benchmark.py -q -x
      - name: Cross-framework inference benchmark (nn vs pytorch)
        run: python -m cnn_benchmark.benchmark --smoke --json benchmark_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark_results.json
      - name: Smoke pretrained mode end-to-end
        run: python -m cnn_benchmark.run_benchmark --smoke --mode pretrained
      - name: Smoke pytorch mode end-to-end
        run: python -m cnn_benchmark.run_benchmark --smoke --mode pytorch

  frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # advisory: heavy optional frameworks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install all frameworks (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu jax[cpu]
          # MLX is Apple-silicon only; on Linux it is expected to be skipped
      - name: Syntax + import smoke test (fail fast before pytest)
        run: python -m cnn_benchmark.smoke_test
      - name: Cross-framework benchmark (nn vs pytorch/tensorflow/jax)
        run: python -m cnn_benchmark.benchmark --json benchmark_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-all-frameworks
          path: benchmark_results.json
